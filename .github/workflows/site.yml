name: Site

on:
  push:
    branches: [master]
  # Run on every pull request regardless of base branch, so stacked PRs
  # (e.g. fix/A → fix/B → master) get full CI on each link of the chain
  # at creation time. Filtering by base would skip everything that does
  # not directly target master, which was a real foot-gun during the
  # player-page refactor (PRs B-E had no Quality/Build/Tests until each
  # one was retargeted and a no-op commit was pushed).
  # ready_for_review too: the jobs skip drafts, and a draft marked ready
  # triggers none of the default types (opened, synchronize, reopened), so
  # its checks stayed skipped until another push (docs.github.com, « Events
  # that trigger workflows », pull_request).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Draws the visual suite's baselines again, in the job's image (job `visual`): the captures it
  # writes come back as the run's `visual-baselines` artifact, to commit on the branch
  # (site/README.md, « Captures et accessibilité »). The other jobs do not run.
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Write every baseline again (--update-snapshots)
        type: boolean
        default: true

# Cancel any in-flight run when a new push lands on the same PR / branch.
# AI-agent iteration loops can push 5-10 times in a few minutes; without
# cancellation each push stacks a fresh Quality/Build/Tests run and we
# race the previous one to no purpose. Not on master: every commit there gets its images
# (job publish), so two merges in a row queue instead of cancelling the first one's.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token reads the repository and nothing else
# (docs.github.com/en/actions/reference/security/secure-use, "least privilege").
permissions:
  contents: read

# The repository is the whole radio: the site lives in site/ (pipeline/ and
# musilogy/ have their own workflows). No path filter: the three jobs below are required checks on
# master, and a workflow skipped by a path filter never reports them.
defaults:
  run:
    working-directory: site

# The images' build arguments, the same in job build (every PR) and job publish (master), so a PR
# builds what master publishes. The VITE_* values are production's, compose.yaml's defaults,
# inlined into the bundle and public by nature (site/README.md).
env:
  IMAGE_BUILD_ARGS: |
    GIT_SHA=${{ github.sha }}
    VITE_API_URL=https://api.aubesonore.fr
    VITE_AZURACAST_BASE_URL=https://radio.aubesonore.fr
    VITE_STATION_SHORTCODE=aubesonore

jobs:
  quality:
    name: Quality (lint, typecheck, test, audit)
    # Skip drafts: AI agents push partial / in-progress work as drafts.
    # We only burn Actions minutes once the author marks the PR ready.
    # Push events to master (no `pull_request` payload) always run.
    if: github.event.pull_request.draft != true && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Workspace packages must be built before lint/typecheck so that their
      # dist/*.d.ts exist — otherwise the typed ESLint rules resolve the
      # subpath imports to `error` types and emit hundreds of false-positive
      # `no-unsafe-*` violations.
      - name: Build workspace packages
        run: pnpm turbo build --filter=@aubesonore/shared-types

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # After Lint: knip resolves the paraglide messages that lint compiles.
      - name: Dead code (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Contrast proof (design tokens)
        run: pnpm --filter=@aubesonore/frontend check:contrast

      - name: Frontend tests with coverage
        run: pnpm --filter=@aubesonore/frontend test --run --coverage

      - name: Deploy script guard
        run: bash scripts/deploy.test.sh

      - name: Database backup script guards
        run: bash scripts/backup-db.test.sh

      - name: Local data script guards
        run: bash scripts/local-data.test.sh

      - name: Security audit (prod, critical blocks)
        run: pnpm audit --prod --audit-level=critical

      - name: Security audit report (high, informational)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  backend-test:
    name: Backend tests (bun)
    if: github.event.pull_request.draft != true && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests against a real Postgres (*.db.test.ts): the same image as production
    # (site/compose.yaml), a database named *_test, which their helper requires. Syntax:
    # docs.github.com, « Creating PostgreSQL service containers ».
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aubesonore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site
        with:
          bun: "true"

      - name: Build workspace packages
        run: pnpm turbo build --filter=@aubesonore/shared-types

      - name: Run backend tests
        run: pnpm --filter=@aubesonore/backend test

      # drizzle-kit writes nothing when the migrations already say what schema.ts says.
      - name: Every schema.ts change has its migration
        run: |
          pnpm --filter=@aubesonore/backend exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- site/apps/backend/drizzle)" ]; then
            echo "::error::schema.ts changed without its migration: run drizzle-kit generate"
            git status --short -- site/apps/backend/drizzle
            exit 1
          fi

      # The test database is built as production's is: by the migrations.
      - name: Migrate the test database
        run: pnpm --filter=@aubesonore/backend db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aubesonore_test

      - name: Run backend tests against Postgres
        run: pnpm --filter=@aubesonore/backend test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aubesonore_test

  build:
    name: Build all
    needs: [quality, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site
        with:
          bun: "true"

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build (backend + frontend)
        run: pnpm turbo build --filter=@aubesonore/backend --filter=@aubesonore/frontend

      # The workspace build above never touches the Dockerfiles, so a broken
      # image shipped to master unnoticed (a COPY of a directory deleted months
      # earlier). Every PR builds the images master publishes (job publish), with the same arguments.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: site
          file: site/Dockerfile
          push: false
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: site
          file: site/apps/frontend/Dockerfile
          push: false
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # The images production runs, built once here from a commit that passed the jobs above (visual
  # included), then pulled by the server (scripts/deploy.sh), which builds nothing: what runs is
  # what was tested ("only build your binaries once", Humble & Farley, Continuous Delivery, ch. 5).
  # Master only, so no pull request's code ever holds a token that writes packages; the write
  # permissions are this job's alone (docs.github.com/en/actions/reference/security/secure-use).
  # Each image carries a signed SLSA provenance attestation, which the server verifies before it
  # runs the image (docs.github.com, « Using artifact attestations to establish provenance »).
  # Packages of a public repository cost nothing to store or pull (docs.github.com, « GitHub
  # Packages billing »): no version is deleted, every past commit stays a rollback target.
  publish:
    name: Publish images
    needs: [build, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image: backend
            file: site/Dockerfile
            target: runner
          - image: frontend
            file: site/apps/frontend/Dockerfile
            target: runner
          - image: renderer
            file: site/apps/frontend/Dockerfile
            target: renderer
    env:
      IMAGE: ghcr.io/victornain26/aubesonore-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # sha-<full commit>: the tag deploy.sh asks for. The OCI labels name the repository, which
      # links the package to it (docs.github.com, « Working with the Container registry »).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: site
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ env.IMAGE_BUILD_ARGS }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=frontend
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  visual:
    name: Visual captures and axe
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Baselines are drawn and compared in one environment (playwright.dev/docs/test-snapshots):
    # the official image of the Playwright the frontend installs, its tag the exact version of
    # @playwright/test in apps/frontend/package.json (both move together), pinned by digest.
    # --user 1001: the runner's user, who owns the workspace (playwright.dev/docs/ci#via-containers).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site

      - name: Build workspace packages
        run: pnpm turbo build --filter=@aubesonore/shared-types

      - name: Visual captures and axe
        env:
          UPDATE: ${{ inputs.update-snapshots && 'true' || '' }}
        run: pnpm --filter=@aubesonore/frontend test:visual ${UPDATE:+--update-snapshots}

      # The captures the run wrote: every one under --update-snapshots, the missing ones
      # otherwise. Rendered in this image, they are the baselines to commit.
      - name: Upload the baselines
        if: failure() || inputs.update-snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: site/apps/frontend/visual/__screenshots__/
          retention-days: 7

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            site/apps/frontend/playwright-report/
            site/apps/frontend/test-results/
          retention-days: 7
