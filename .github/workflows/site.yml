name: Site

on:
  push:
    branches: [master]
  # Run on every pull request regardless of base branch, so stacked PRs
  # (e.g. fix/A → fix/B → master) get full CI on each link of the chain
  # at creation time. Filtering by base would skip everything that does
  # not directly target master, which was a real foot-gun during the
  # player-page refactor (PRs B-E had no Quality/Build/Tests until each
  # one was retargeted and a no-op commit was pushed).
  # ready_for_review too: the jobs skip drafts, and a draft marked ready
  # triggers none of the default types (opened, synchronize, reopened), so
  # its checks stayed skipped until another push (docs.github.com, « Events
  # that trigger workflows », pull_request).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel any in-flight run when a new push lands on the same PR / branch.
# AI-agent iteration loops can push 5-10 times in a few minutes; without
# cancellation each push stacks a fresh Quality/Build/Tests run and we
# race the previous one to no purpose.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The token reads the repository and nothing else
# (docs.github.com/en/actions/reference/security/secure-use, "least privilege").
permissions:
  contents: read

# The repository is the whole radio: the site lives in site/ (pipeline/ and
# musilogy/ have their own workflows). No path filter: the three jobs below are required checks on
# master, and a workflow skipped by a path filter never reports them.
defaults:
  run:
    working-directory: site

jobs:
  quality:
    name: Quality (lint, typecheck, test, audit)
    # Skip drafts: AI agents push partial / in-progress work as drafts.
    # We only burn Actions minutes once the author marks the PR ready.
    # Push events to master (no `pull_request` payload) always run.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Workspace packages must be built before lint/typecheck so that their
      # dist/*.d.ts exist — otherwise the typed ESLint rules resolve the
      # subpath imports to `error` types and emit hundreds of false-positive
      # `no-unsafe-*` violations.
      - name: Build workspace packages
        run: pnpm turbo build --filter=@aubesonore/shared-types

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # After Lint: knip resolves the paraglide messages that lint compiles.
      - name: Dead code (knip)
        run: pnpm knip

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Contrast proof (design tokens)
        run: pnpm --filter=@aubesonore/frontend check:contrast

      - name: Frontend tests with coverage
        run: pnpm --filter=@aubesonore/frontend test --run --coverage

      - name: Deploy script guard
        run: bash scripts/deploy.test.sh

      - name: Local data script guards
        run: bash scripts/local-data.test.sh

      - name: Security audit (prod, critical blocks)
        run: pnpm audit --prod --audit-level=critical

      - name: Security audit report (high, informational)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  backend-test:
    name: Backend tests (bun)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The tests against a real Postgres (*.db.test.ts): the same image as production
    # (site/compose.yaml), a database named *_test, which their helper requires. Syntax:
    # docs.github.com, « Creating PostgreSQL service containers ».
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aubesonore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site
        with:
          bun: 'true'

      - name: Build workspace packages
        run: pnpm turbo build --filter=@aubesonore/shared-types

      - name: Run backend tests
        run: pnpm --filter=@aubesonore/backend test

      - name: Push the schema to the test database
        run: pnpm --filter=@aubesonore/backend db:push
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aubesonore_test

      - name: Run backend tests against Postgres
        run: pnpm --filter=@aubesonore/backend test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aubesonore_test

  build:
    name: Build all
    needs: [quality, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-site
        with:
          bun: 'true'

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build (backend + frontend)
        run: pnpm turbo build --filter=@aubesonore/backend --filter=@aubesonore/frontend

      # The workspace build above never touches the Dockerfiles, so a broken
      # image shipped to master unnoticed (a COPY of a directory deleted months
      # earlier). Deployment builds these images, so CI must too.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: site
          file: site/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: site
          file: site/apps/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
