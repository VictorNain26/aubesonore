name: Pipeline

on:
  push:
    branches: [master]
  # ready_for_review too: the job skips drafts, like site.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the run in progress on the same PR or branch (like site.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The pipeline lives in pipeline/. No path filter: this job is a required check on master, and a
# workflow skipped by a filter never reports it.
defaults:
  run:
    working-directory: pipeline

jobs:
  checks:
    name: Pipeline (ruff, mypy, pytest)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          working-directory: pipeline
      # Audio tools for acquisition: the integration test really runs them.
      # Azure's Ubuntu mirror sometimes serves at ~180 KB/s (up to 11 min for ffmpeg): the .debs
      # stay cached (Dir::Cache::archives, apt.conf(5)) and apt downloads only the new ones.
      # ImageOS/ImageVersion come from /etc/environment (actions/runner-images).
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-ffmpeg-chromaprint-${{ steps.image.outputs.version }}
          restore-keys: apt-ffmpeg-chromaprint-
      - run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives" ffmpeg libchromaprint-tools
          sudo apt-get autoclean -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives"
          sudo chown -R "$USER" "$RUNNER_TEMP/apt-archives"
      # rsgain 3.8 and the EffNet model: the same recipe as a workstation (scripts/dev-setup.sh),
      # checksums verified. fpcalc comes from apt above, as in production. The key follows the file
      # that pins the model's checksum.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/models/discogs-effnet-bs64-1.pb
          key: effnet-${{ hashFiles('pipeline/radio/signals/audio.py') }}
      - run: |
          scripts/dev-setup.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rsgain --version
      - run: uv sync --locked
      - run: uv run ruff check radio tests_radio
      - run: uv run ruff format --check radio tests_radio
      - run: uv run mypy
      - run: uv run pytest -q -W error -rs
