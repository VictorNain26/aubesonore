name: Pipeline

on:
  push:
    branches: [master]
  pull_request:

# Un nouveau push annule le run en cours sur la même PR ou branche (comme site.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Le pipeline vit dans pipeline/. Pas de filtre de chemin : ce job est un contrôle requis sur
# master, et un workflow sauté par un filtre ne le rapporte jamais.
defaults:
  run:
    working-directory: pipeline

jobs:
  checks:
    name: Pipeline (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          working-directory: pipeline
      # Outils audio de l'acquisition : le test d'intégration les fait tourner pour de vrai.
      # Le miroir Ubuntu d'Azure sert parfois à ~180 Ko/s (jusqu'à 11 min pour ffmpeg) : les .deb
      # restent en cache (Dir::Cache::archives, apt.conf(5)) et apt ne télécharge que les nouveaux.
      # ImageOS/ImageVersion viennent de /etc/environment (actions/runner-images).
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-ffmpeg-chromaprint-${{ steps.image.outputs.version }}
          restore-keys: apt-ffmpeg-chromaprint-
      - run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives" ffmpeg libchromaprint-tools
          sudo apt-get autoclean -o Dir::Cache::Archives="$RUNNER_TEMP/apt-archives"
          sudo chown -R "$USER" "$RUNNER_TEMP/apt-archives"
      # rsgain 3.8, la version figée en production (docs/vision.md §6), et non la 3.4 d'apt.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/rsgain.tar.xz" https://github.com/complexlogic/rsgain/releases/download/v3.8/rsgain-3.8-Linux.tar.xz
          echo "4939de3b2022a50edc0751343b10a791ea8c1c9ca6505012f21413bf8de365a0  $RUNNER_TEMP/rsgain.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/rsgain.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rsgain-3.8-Linux" >> "$GITHUB_PATH"
      # Modèle EffNet officiel, somme de contrôle épinglée dans radio/signals/audio.py.
      - id: effnet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pipeline/models/discogs-effnet-bs64-1.pb
          key: effnet-3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1
      - if: steps.effnet.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/discogs-effnet-bs64-1.pb https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb
      - run: echo "3ed9af50d5367c0b9c795b294b00e7599e4943244f4cbd376869f3bfc87721b1  models/discogs-effnet-bs64-1.pb" | sha256sum -c
      - run: rsgain --version
      - run: uv sync --locked
      - run: uv run ruff check radio tests_radio
      - run: uv run ruff format --check radio tests_radio
      - run: uv run mypy
      - run: uv run pytest -q -W error -rs
