# Secret scanning of every commit a push or PR brings, with the full history checked out so
# gitleaks can walk it. The workstation runs the same scan before each commit
# (site/.husky/pre-commit); .gitleaksignore lists the reviewed false positives.
name: Secrets

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments on PRs would need pull-requests: write; the job log is enough.
          GITLEAKS_ENABLE_COMMENTS: false
