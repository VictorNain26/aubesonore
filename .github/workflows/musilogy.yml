name: musilogy

on:
  push:
    branches: [master]
  pull_request:

# Un nouveau push annule le run en cours sur la même PR ou branche (comme site.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# musilogy vit dans musilogy/. Pas de filtre de chemin : ce job est un contrôle requis sur
# master, et un workflow sauté par un filtre ne le rapporte jamais.
defaults:
  run:
    working-directory: musilogy

jobs:
  checks:
    name: musilogy (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Les tests du chargement (tests/test_load.py) tournent contre un vrai Postgres, de la même
    # version majeure que la base du site. Syntaxe : docs.github.com, « Creating PostgreSQL service
    # containers ».
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          python-version: "3.12"
          working-directory: musilogy
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # La suite lente (pytest -m slow) rejoue le pipeline sur le dump MusicBrainz réel : elle exige
      # les extractions de data/work/, non versionnées, et ne tourne donc pas ici. addopts l'exclut.
      - run: uv run pytest
        env:
          MUSILOGY_TEST_PG: host=localhost port=5432 user=postgres password=postgres dbname=postgres
