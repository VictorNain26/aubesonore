name: musilogy

on:
  push:
    branches: [master]
  # ready_for_review too: the job skips drafts, like site.yml.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push cancels the run in progress on the same PR or branch (like site.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# musilogy lives in musilogy/. No path filter: this job is a required check on master, and a
# workflow skipped by a filter never reports it.
defaults:
  run:
    working-directory: musilogy

jobs:
  checks:
    name: musilogy (ruff, mypy, pytest)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The load tests (tests/test_load.py) run against a real Postgres, of the same major version
    # as the site's database. Syntax: docs.github.com, « Creating PostgreSQL service containers ».
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.19"
          working-directory: musilogy
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q -W error -rs
        env:
          MUSILOGY_TEST_PG: host=localhost port=5432 user=postgres password=postgres dbname=postgres
