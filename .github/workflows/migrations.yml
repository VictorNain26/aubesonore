# A merged migration is deployed (merging to master deploys) and never runs again: the backend
# applies only the drizzle/ migrations its database has not run (Drizzle's migrate, after the last
# one recorded), the pipeline only versions above PRAGMA user_version (radio/core/db.py, _migrate).
# Editing, renaming or deleting one would leave production's schema silently different from the
# code, so a change goes in a new file.
name: Migrations

on:
  pull_request:
    branches: [master]

concurrency:
  group: migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The site's migrations are those Drizzle's journal lists on master: their files stay as
      # they are, and the journal only grows.
      - name: Merged migrations are left unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          JOURNAL: site/apps/backend/drizzle/meta/_journal.json
        run: |
          merged=$(git show "$BASE:$JOURNAL" 2>/dev/null || echo '{"entries":[]}')
          site=$(jq -r '.entries[].tag | "site/apps/backend/drizzle/\(.).sql"' <<<"$merged")
          changed=$(git diff --name-only --diff-filter=MDR "$BASE...HEAD" -- \
            $site 'pipeline/radio/core/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Merged migrations changed; write a new migration instead:"
            echo "$changed"
            exit 1
          fi
          if ! jq -e --argjson merged "$(jq .entries <<<"$merged")" \
            '.entries[:($merged | length)] == $merged' "$JOURNAL" >/dev/null; then
            echo "::error::$JOURNAL changed its merged entries; only new ones are added"
            exit 1
          fi
