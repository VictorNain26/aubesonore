# The toolchain every site job starts from, after its checkout: pnpm (the version in
# site/package.json's packageManager), Node with the pnpm store cached, Bun when the job runs the
# backend, then the workspace's dependencies.
name: Set up the site
description: pnpm, Node, optionally Bun, then pnpm install --frozen-lockfile in site/
inputs:
  bun:
    description: Also install Bun, the runtime the backend image ships
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: site/package.json
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: site/pnpm-lock.yaml
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        # The runtime the image ships (site/Dockerfile, oven/bun:1.4.2-slim): tests run on it.
        bun-version: '1.4.4'
    - name: Install dependencies
      shell: bash
      working-directory: site
      run: pnpm install --frozen-lockfile
