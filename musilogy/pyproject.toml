[project]
name = "musilogy"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb==1.5.5",
]

[project.scripts]
musilogy = "musilogy.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.14",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full run on the reference dump"]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PTH", "PL",
    "PT", "ARG", "DTZ", "TID",
]
ignore = [
    # build() takes the pipeline's real inputs (connection, sql dir, two raw
    # sources, corrections, two calendar bounds): splitting them into a
    # config object is an API change to every caller, not a mechanical fix.
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["duckdb"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test functions take pytest fixtures (con, tmp_path, monkeypatch, caplog...)
# and never return a value: requiring "-> None" and fixture types on every
# one-line test adds annotation noise without catching real bugs. Bodies are
# still checked (check_untyped_defs, part of strict, stays on).
module = [
    "conftest", "test_albums", "test_artist", "test_bands", "test_baseline",
    "test_cli", "test_corrections", "test_env", "test_extract", "test_fetch",
    "test_fixtures", "test_genres", "test_influences", "test_invariants", "test_lifespan",
    "test_links", "test_load", "test_paths", "test_persons", "test_popularity",
    "test_proximity", "test_publish", "test_releases", "test_search", "test_types", "test_urls",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
