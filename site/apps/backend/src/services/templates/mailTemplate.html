<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>{{subject}}</title>
  </head>

  <!-- The site's paper, ink and dawn (apps/frontend/src/design/tokens.css), as plain hex: mail
       clients read neither oklch nor custom properties. Tables and inline styles, as they need. -->
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #e8e0d7;
      color: #211f26;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">{{preheader}}</div>
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      role="presentation"
      style="background-color: #e8e0d7"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            width="520"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="width: 520px; max-width: 100%"
          >
            <tr>
              <td style="padding-bottom: 32px">
                <img
                  src="https://aubesonore.fr/icon-180.png"
                  alt=""
                  width="40"
                  height="40"
                  style="display: inline-block; vertical-align: middle; border-radius: 8px"
                />
                <span
                  style="
                    display: inline-block;
                    vertical-align: middle;
                    margin-left: 10px;
                    font-size: 22px;
                    font-weight: 600;
                    letter-spacing: -0.02em;
                  "
                  >aubesonore</span
                >
              </td>
            </tr>
            <tr>
              <td>
                <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600">
                  {{heading}}
                </h1>
                <p style="margin: 16px 0 0; font-size: 16px; line-height: 1.55; color: #4a4650">
                  {{body}}
                </p>
                <p style="margin: 32px 0 0">
                  <a
                    href="{{buttonLink}}"
                    style="
                      display: inline-block;
                      padding: 14px 28px;
                      border-radius: 999px;
                      background-color: #211f26;
                      color: #e8e0d7;
                      font-size: 16px;
                      font-weight: 600;
                      text-decoration: none;
                    "
                    >{{buttonText}}</a
                  >
                </p>
                <p style="margin: 32px 0 0; font-size: 14px; line-height: 1.5; color: #4a4650">
                  {{ignore}}
                </p>
              </td>
            </tr>
            <tr>
              <td style="height: 40px; line-height: 40px; font-size: 0">&nbsp;</td>
            </tr>
            <tr>
              <td
                style="
                  padding-top: 16px;
                  border-top: 1px solid #f2ac81;
                  font-size: 12px;
                  color: #4a4650;
                "
              >
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
