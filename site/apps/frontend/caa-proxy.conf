# What every step of /caa/ shares (nginx.conf): the cache, the redirects handed back to nginx,
# the archive told who asks, and the headers a cover leaves with.
proxy_cache caa;
proxy_cache_key $uri;
proxy_cache_valid 200 60d;
proxy_cache_valid 404 1d;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_intercept_errors on;
recursive_error_pages on;
proxy_ssl_server_name on;
proxy_set_header User-Agent "AubeSonore/1.0 (https://github.com/VictorNain26/aubesonore)";
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header X-Content-Type-Options;
add_header Cache-Control "public, max-age=2592000" always;
include /etc/nginx/snippets/security-headers.conf;
