# What every step of /caa/ shares (nginx.conf): the cache, the redirects handed back to nginx,
# what the archive is told and what it may not decide, and the headers a cover leaves with.
proxy_cache caa;
proxy_cache_key $uri;
proxy_cache_valid 200 60d;
proxy_cache_valid 404 1d;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
# This file decides how long a cover is kept, never the archive: an upstream max-age would shorten
# the 60 days, and a cacheable redirect would be stored without its Location and break the cover.
proxy_ignore_headers Cache-Control Expires X-Accel-Expires X-Accel-Redirect Set-Cookie Vary;
proxy_intercept_errors on;
recursive_error_pages on;
# Only certificates the image trusts: a redirect is followed only to the archive (nginx.conf).
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
# A slow node gives way to the retry well before Cloudflare's 100 s.
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
# Nothing of the listener reaches the archive: no cookie, no address, no language.
proxy_pass_request_headers off;
proxy_set_header User-Agent "AubeSonore/1.0 (https://github.com/VictorNain26/aubesonore)";
proxy_set_header Accept "image/jpeg,image/*";
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
# 30 days for a cover, a day for a missing one, nothing kept of a failure ($caa_cache_control).
add_header Cache-Control $caa_cache_control always;
include /etc/nginx/snippets/security-headers.conf;
