# Shared security headers.
# nginx drops every inherited add_header as soon as a location block declares
# one of its own, so this snippet is included at each level that needs them
# rather than relying on inheritance from the server block.
# https://nginx.org/en/docs/http/ngx_http_headers_module.html

# Clickjacking + MIME sniffing
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# TLS enforcement (assume TLS-terminating reverse proxy in prod)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Referer leakage + cross-origin isolation
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(), camera=(), geolocation=()" always;
# No other site's window keeps a handle on ours (the Google sign-in is a redirect, not a popup).
# https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Cross-Origin-Opener-Policy
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy
# - script-src : self + gstatic (Google Cast SDK, injected at runtime)
# - connect-src : SSE + REST against *.aubesonore.fr
# - media-src   : MP3 stream from radio.aubesonore.fr
# - img-src https: + data: to allow any AzuraCast art proxy and inline blobs
# - style-src 'unsafe-inline' is required by Tailwind 4 dev injection and
#   framer-motion's style attribute pattern (no scriptable XSS surface).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.aubesonore.fr wss://*.aubesonore.fr; media-src 'self' https://*.aubesonore.fr; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
