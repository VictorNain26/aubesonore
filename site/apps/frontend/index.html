<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Warm the connection to the media origin (audio stream + now-playing API
         + artwork, the likely LCP) so its TLS/DNS is ready before first paint. -->
    <link rel="preconnect" href="https://radio.aubesonore.fr" />
    <link
      rel="preload"
      href="https://radio.aubesonore.fr/api/nowplaying_static/aubesonore.json"
      as="fetch"
      crossorigin
    />

    <!-- SEO -->
    <title>AubeSonore</title>
    <meta
      name="description"
      content="Une radio de découverte, un titre après l'autre, gratuite et sans publicité. Gardez ceux qui vous arrêtent, retrouvez-les sur votre plateforme."
    />
    <meta name="author" content="AubeSonore" />
    <meta name="theme-color" content="#e8e0d7" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://aubesonore.fr/" />

    <!-- Structured data — RadioStation + WebSite (schema.org).
         Improves understanding by Google Search, AI Overviews, Perplexity,
         ChatGPT search, Claude web. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@id": "https://aubesonore.fr/#org",
            "@type": "RadioStation",
            "name": "AubeSonore",
            "alternateName": "AubeSonore Webradio",
            "url": "https://aubesonore.fr/",
            "description": "Une radio de découverte, un titre après l'autre. Gratuite, sans publicité, en continu jour et nuit.",
            "logo": "https://aubesonore.fr/icon-512.png",
            "image": "https://aubesonore.fr/og-fr.png",
            "inLanguage": "fr-FR",
            "broadcastDisplayName": "AubeSonore",
            "broadcastTimezone": "Europe/Paris",
            "potentialAction": {
              "@type": "ListenAction",
              "target": "https://radio.aubesonore.fr/listen/aubesonore/radio.mp3"
            }
          },
          {
            "@id": "https://aubesonore.fr/#site",
            "@type": "WebSite",
            "url": "https://aubesonore.fr/",
            "name": "AubeSonore",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://aubesonore.fr/#org" }
          }
        ]
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AubeSonore" />
    <meta
      property="og:description"
      content="Une radio de découverte, un titre après l'autre, gratuite et sans publicité. Gardez ceux qui vous arrêtent, retrouvez-les sur votre plateforme."
    />
    <meta property="og:image" content="https://aubesonore.fr/og-fr.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AubeSonore" />
    <meta property="og:url" content="https://aubesonore.fr/" />
    <meta property="og:site_name" content="AubeSonore" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aubesonore" />
    <meta name="twitter:creator" content="@aubesonore" />
    <meta name="twitter:title" content="AubeSonore" />
    <meta
      name="twitter:description"
      content="Une radio de découverte, un titre après l'autre, gratuite et sans publicité. Gardez ceux qui vous arrêtent, retrouvez-les sur votre plateforme."
    />
    <meta name="twitter:image" content="https://aubesonore.fr/og-fr.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
