<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Warm the connection to the media origin (audio stream + now-playing API
         + artwork, the likely LCP) so its TLS/DNS is ready before first paint. -->
    <link rel="preconnect" href="https://radio.aubesonore.fr" />
    <link
      rel="preload"
      href="https://radio.aubesonore.fr/api/nowplaying_static/aubesonore.json"
      as="fetch"
      crossorigin
    />

    <!-- SEO -->
    <title>AubeSonore · Radio de découverte indé, électro, hip-hop</title>
    <meta
      name="description"
      content="Webradio gratuite et sans publicité : rock et pop indé, électronique, hip-hop, des années 60 à aujourd'hui. Des titres à découvrir, et la page de chaque artiste."
    />
    <meta name="author" content="AubeSonore" />
    <!-- The paper by day and the night sky (src/design/tokens.css, --surface), in hex for the
         browser's own bars. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1e5dc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151d33" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://aubesonore.fr/" />

    <!-- Structured data (schema.org): the website, its name and its other spellings, which Google
         reads to name the site in its results (developers.google.com/search/docs/appearance/
         site-names). The pre-render puts the English description and language on /en/
         (scripts/head.mjs). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://aubesonore.fr/#site",
        "url": "https://aubesonore.fr/",
        "name": "AubeSonore",
        "alternateName": ["Aube Sonore", "aubesonore.fr"],
        "description": "Webradio gratuite et sans publicité : rock et pop indé, électronique, hip-hop, des années 60 à aujourd'hui. Des titres à découvrir, et la page de chaque artiste.",
        "inLanguage": "fr-FR"
      }
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AubeSonore · Radio de découverte indé, électro, hip-hop" />
    <meta
      property="og:description"
      content="Webradio gratuite et sans publicité : rock et pop indé, électronique, hip-hop, des années 60 à aujourd'hui. Des titres à découvrir, et la page de chaque artiste."
    />
    <meta property="og:image" content="https://aubesonore.fr/og-fr.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AubeSonore" />
    <meta property="og:url" content="https://aubesonore.fr/" />
    <meta property="og:site_name" content="AubeSonore" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AubeSonore · Radio de découverte indé, électro, hip-hop" />
    <meta
      name="twitter:description"
      content="Webradio gratuite et sans publicité : rock et pop indé, électronique, hip-hop, des années 60 à aujourd'hui. Des titres à découvrir, et la page de chaque artiste."
    />
    <meta name="twitter:image" content="https://aubesonore.fr/og-fr.png" />

    <!-- Favicons -->
    <!-- sizes="32x32" keeps Chrome on the SVG (evilmartians.com/chronicles/how-to-favicon-in-2021-six-files-that-fit-most-needs) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
