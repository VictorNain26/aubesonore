# The tunnel sends both hostnames here. The apex is canonical: index.html's
# canonical/og:url/JSON-LD and the backend's FRONTEND_BASE_URL all declare it,
# and the artist page injects Open Graph tags against that same origin.
server {
    listen 80;
    server_name www.aubesonore.fr;
    return 301 https://aubesonore.fr$request_uri;
}

server {
    listen 80 default_server;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    include /etc/nginx/snippets/security-headers.conf;
    # HTML, the service worker and the manifest keep their URL across deploys:
    # browsers must revalidate them (Last-Modified) or a deploy goes unseen.
    # The hashed assets below override this with a one-year immutable cache.
    add_header Cache-Control "no-cache" always;

    # Entry points: the pre-rendered home in French (/) and English (/en/), the
    # Better Auth reset link, and the artist pages (proxied below). Any other unknown path must answer a real
    # 404, or crawlers index it as a soft 404.
    location = / {
        try_files /index.html =404;
    }

    location = /en/ {
        try_files /en/index.html =404;
    }

    # Relative Location: behind the tunnel, nginx only sees http on port 80.
    absolute_redirect off;

    location = /en {
        return 301 /en/;
    }

    location = /mentions-legales {
        return 301 /mentions-legales/;
    }

    location = /en/legal {
        return 301 /en/legal/;
    }

    location = /mentions-legales/ {
        try_files /mentions-legales/index.html =404;
    }

    location = /en/legal/ {
        try_files /en/legal/index.html =404;
    }

    # The sign-in page (and Better Auth's reset link, /reset-password?token=) and the listener's
    # kept tracks are the app shell: pages for one listener, never for search engines.
    location ~ ^/(connexion|en/sign-in|reset-password|mes-titres|en/my-tracks)/?$ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /app.html =404;
    }

    # Artist pages come from the backend, which writes each artist's title and
    # Open Graph tags into the app shell (artistPage.routes.ts): /artiste/<slug>
    # and /en/artist/<slug>, plus the old /artist/<id>/… it redirects. An unknown
    # slug passes through as its 404 (proxy_intercept_errors is off by default).
    # The backend is resolved at request time through Docker's embedded DNS
    # (127.0.0.11, https://docs.docker.com/engine/network/): a literal upstream
    # would keep nginx, and the whole site, from starting while the API is down.
    # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
    location ~ ^/(artiste|(en/)?artist)/[^/]+(/[^/]*)?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend$request_uri;
        # One set of headers for every HTML page: this file's, not the API's
        # JSON policy, whose default-src 'none' would block the app.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        # An HTML page, not the API: its CORS headers have no business here.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The artist pages' sitemap is written by the backend from its slugs
    # (artistPage.routes.ts); robots.txt names it beside sitemap.xml. The
    # backend's one-hour Cache-Control passes: the snippet's add_header stops
    # this server's "no-cache" from being inherited, and the API's own security
    # and CORS headers are hidden so each is sent once.
    # https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
    location = /sitemap-artists.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend$request_uri;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # An artist's Musilogy page is its artist page now, at its MBID
    # (docs/vision.md §5): the old address, still in shares, is a permanent
    # redirect there, which sends a played artist on to its slug.
    location ~ "^/musilogy/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(/[^/]*)?/?$" {
        return 301 /artiste/$1;
    }
    location ~ "^/en/musilogy/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(/[^/]*)?/?$" {
        return 301 /en/artist/$1;
    }

    # Musilogy: the app shell, kept out of search results until a page's
    # richness threshold is measured (docs/vision.md §2.3). X-Robots-Tag is the
    # header form of the robots meta tag
    # (developers.google.com/search/docs/crawling-indexing/robots-meta-tag).
    # A location with its own add_header inherits none from the server:
    # Cache-Control is repeated, or a shell kept past a deploy points at
    # deleted assets.
    location ~ ^/(en/)?musilogy(/[^/]+(/[^/]*)?)?/?$ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /app.html =404;
    }

    # The Cast receiver (cast/receiver.html), opened by a TV or a speaker, not by a browser. Its
    # CSP is its own, written whole here: two CSP headers would both apply. Google's receiver
    # framework loads its player from www.gstatic.com and Shaka Player from ajax.googleapis.com
    # (strings of cast_receiver_framework.js v3), and may feed the media element through Media
    # Source Extensions (blob:).
    location = /cast/receiver.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com https://ajax.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.aubesonore.fr https://www.gstatic.com ws://localhost:*; media-src 'self' blob: https://*.aubesonore.fr; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    location /en/ {
        try_files $uri =404;
        error_page 404 /en/404.html;
    }

    error_page 404 /404.html;

    # nginx's bundled mime.types has no .webmanifest entry, so it would ship as
    # application/octet-stream and browsers would ignore the manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Only /assets/ is hashed by Vite, so only it is safe to cache for a year.
    # Icons and share images keep their name and fall back to no-cache.
    # The snippet is repeated here because the add_header below would
    # otherwise drop every security header inherited from the server block.
    location /assets/ {
        # The .gz written at build (scripts/precompress.mjs), best level, for clients that take gzip.
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
