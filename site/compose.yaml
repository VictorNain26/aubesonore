# AubeSonore's site: one stack for the production box and for a workstation.
#
# Production (scripts/deploy.sh): `docker compose up -d --build` runs Postgres, the backend,
# the static frontend and the renderer. Public exposure (aubesonore.fr / api / radio) is the
# host-level cloudflared service's, not this file's. AzuraCast keeps its own compose
# (azuracast/), which its updater manages and which a site deploy must never touch.
#
# Workstation (README): `pnpm stack` runs the same Postgres and backend, plus the services of
# the `dev` profile: dev-init (schema and a test listener) and frontend-dev (Vite, hot reload).
# Neither a profile nor `develop.watch` is ever active on the production box.
# Both need certs/ (scripts/make-certs.sh) and .env (.env.example).

name: aubesonore

# The backend's environment, shared with dev-init, which runs the backend's own scripts.
x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-aubesonore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aubesonore}
  DATABASE_SSL: 'true'
  DATABASE_CA_CERT_FILE: /certs/ca.crt
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.aubesonore.fr}
  BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://api.aubesonore.fr}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://aubesonore.fr}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://aubesonore.fr}
  # Unset: production's domain. Empty (a workstation): host-only cookies.
  COOKIE_DOMAIN: ${COOKIE_DOMAIN-.aubesonore.fr}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
  SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-AubeSonore <noreply@aubesonore.fr>}
  DISABLE_EMAILS: ${DISABLE_EMAILS:-false}
  ENABLE_CRON: ${ENABLE_CRON:-false}
  AZURACAST_BASE_URL: ${AZURACAST_BASE_URL:-http://host.docker.internal:8080}
  AZURACAST_API_KEY: ${AZURACAST_API_KEY:-}
  AZURACAST_STATION_ID: ${AZURACAST_STATION_ID:-1}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

services:
  # Stages TLS material into a volume with postgres-owned perms (PG rejects a key
  # that is group/world readable). Runs as root, sets uid 70 (postgres in alpine).
  pg-cert-init:
    image: alpine:3
    container_name: aubesonore-pg-cert-init
    restart: 'no'
    volumes:
      - ./certs:/src:ro
      - pg_certs:/dst
    command: >
      sh -c "cp /src/server.crt /src/server.key /src/ca.crt /src/pg_hba.conf /dst/ &&
             chown 70:70 /dst/server.crt /dst/server.key /dst/ca.crt /dst/pg_hba.conf &&
             chmod 600 /dst/server.key && chmod 640 /dst/server.crt /dst/pg_hba.conf && chmod 644 /dst/ca.crt"

  postgres:
    image: postgres:16-alpine
    container_name: aubesonore-db
    restart: unless-stopped
    depends_on:
      pg-cert-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aubesonore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aubesonore}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/certs/pg_hba.conf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_certs:/certs:ro
    # Loopback only, for `musilogy load` run on the host (TLS still required by
    # pg_hba.conf; the certificate covers localhost).
    ports:
      - '127.0.0.1:5433:5432'
    # Docker's 64 MB /dev/shm fails the parallel index build of the musilogy
    # load ("could not resize shared memory segment"); 128mb is the image's
    # own Compose example (hub.docker.com/_/postgres).
    shm_size: 128mb
    # This box is a shared homelab running ~22 containers; a runaway here must
    # not take Plex down with it. The ceilings sit ~20x above observed steady
    # state, so they cap accidents without throttling normal work.
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aubesonore}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: '10m', max-file: '3' }

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Named so dev-init runs this very image instead of building its own.
    image: aubesonore-backend
    container_name: aubesonore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # On a workstation, the schema and the test listener come first; production has no dev-init.
      dev-init:
        condition: service_completed_successfully
        required: false
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment: *backend-environment
    volumes:
      - pg_certs:/certs:ro
    ports:
      - '127.0.0.1:3001:3000'
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The journal, not json-file: a deploy recreates this container, and json-file logs go
    # with it (84 deploys in 72 h before 2026-10-07). journald rotates them (SystemMaxUse);
    # read with `journalctl CONTAINER_TAG=aubesonore-backend` or `docker logs`
    # (https://docs.docker.com/engine/logging/drivers/journald/).
    logging:
      driver: journald
      options: { tag: aubesonore-backend }
    # `docker compose up --watch` only (https://docs.docker.com/compose/how-tos/file-watch/):
    # an edit restarts Bun on the new code; a dependency change rebuilds the image.
    develop:
      watch:
        - action: sync+restart
          path: ./apps/backend/src
          target: /app/apps/backend/src
        - action: rebuild
          path: ./apps/backend/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # Static SPA served by nginx. Published on loopback only: public exposure
  # goes through the host-level cloudflared tunnel, same as the backend.
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.aubesonore.fr}
        VITE_AZURACAST_BASE_URL: ${VITE_AZURACAST_BASE_URL:-https://radio.aubesonore.fr}
        VITE_STATION_SHORTCODE: ${VITE_STATION_SHORTCODE:-aubesonore}
    container_name: aubesonore-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:80'
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: journald
      options: { tag: aubesonore-frontend }

  # The artist pages' server render, which the backend asks for
  # (artistPage.routes.ts). Built with the frontend, from the same build stage,
  # so its markup is the one the client hydrates. Not published: the backend
  # reaches it on the compose network.
  renderer:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: renderer
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.aubesonore.fr}
        VITE_AZURACAST_BASE_URL: ${VITE_AZURACAST_BASE_URL:-https://radio.aubesonore.fr}
        VITE_STATION_SHORTCODE: ${VITE_STATION_SHORTCODE:-aubesonore}
    container_name: aubesonore-renderer
    restart: unless-stopped
    # A render is ~100 ms of CPU: at 0.5 the quota throttles it to 285–485 ms,
    # past the backend's 300 ms budget (measured 2026-10-06).
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: journald
      options: { tag: aubesonore-renderer }

  # ── Workstation only (profile `dev`) ──────────────────────────────────────────────────

  # An empty database gets its schema from schema.ts (the baseline migrations are recorded, not
  # run: they predate this stack), then a verified test listener with a few kept tracks.
  dev-init:
    profiles: [dev]
    image: aubesonore-backend
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-environment
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
      DEV_USER_NAME: ${DEV_USER_NAME:-}
    volumes:
      - pg_certs:/certs:ro
    # drizzle-kit reads TLS from the URL, the backend from DATABASE_CA_CERT_FILE.
    command:
      - sh
      - -c
      - DATABASE_URL="$$DATABASE_URL?sslmode=verify-full&sslrootcert=/certs/ca.crt" bun run db:push && bun run seed:dev
    restart: 'no'

  # The SPA from source, with hot reload. The workspace is mounted; what the container installs
  # and generates stays in volumes, so nothing it writes lands in the checkout. /api goes to the
  # backend; with PUBLIC_API_PROXY_TARGET set, the public reads a fresh database cannot answer
  # (Musilogy, the artist pages, today's plays, the trends) come from that API (vite.config.ts).
  frontend-dev:
    profiles: [dev]
    image: node:22-slim
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CI: 'true'
      VITE_API_URL: ''
      VITE_AZURACAST_BASE_URL: ${VITE_AZURACAST_BASE_URL:-https://radio.aubesonore.fr}
      VITE_STATION_SHORTCODE: ${VITE_STATION_SHORTCODE:-aubesonore}
      API_PROXY_TARGET: http://backend:3000
      PUBLIC_API_PROXY_TARGET: ${PUBLIC_API_PROXY_TARGET:-}
    command:
      - sh
      - -c
      - >-
        corepack enable pnpm &&
        pnpm config set store-dir /pnpm-store &&
        pnpm install --frozen-lockfile --filter @aubesonore/frontend... &&
        pnpm --filter @aubesonore/shared-types build &&
        pnpm --filter @aubesonore/core build &&
        pnpm --filter @aubesonore/frontend dev
    volumes:
      - .:/app
      - pnpm_store:/pnpm-store
      - /app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/src/paraglide
      - /app/packages/core/node_modules
      - /app/packages/core/dist
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-types/dist
    ports:
      - '127.0.0.1:5173:5173'

volumes:
  postgres_data:
  pg_certs:
  pnpm_store:
