# The preview's API on its own origin (compose.preview.yaml mounts this file; production's
# nginx.conf includes snippets/preview-*.conf and finds none): /api goes to this project's
# backend, resolved like the artist pages' at request time.
location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:3000;
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
