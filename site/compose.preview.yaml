# The preview of a branch on the production box (scripts/preview.sh, README « Aperçu d'une
# branche »): compose.yaml itself, under the project aubesonore-preview, with only what must
# differ from production so both run side by side. Never used by deploy.sh.
#
# - Its own names: containers, ports, the backend's image tag and the journal's tags. The image
#   tag above all: a preview built as aubesonore-backend would become the image production next
#   starts; the tags keep `journalctl CONTAINER_TAG=aubesonore-backend` production's alone.
# - Started by hand only (`restart: 'no'`): a reboot of the box brings production back, not
#   the preview.
# - Its own database: the project's volume, never production's. Musilogy reaches it by
#   `scripts/preview.sh musilogy`, the load production gets.
# - One origin: the page calls /api on itself and nginx passes it to this project's backend
#   (preview/api.conf), so the app needs no other host than the tunnel to the box's loopback.
#   Ports are replaced, not appended (`!override`, docs.docker.com/reference/compose-file/merge/).

services:
  pg-cert-init:
    container_name: aubesonore-preview-pg-cert-init

  postgres:
    container_name: aubesonore-preview-db
    restart: 'no'
    ports: !override
      - '127.0.0.1:5434:5432'

  backend:
    image: aubesonore-preview-backend
    container_name: aubesonore-preview-backend
    restart: 'no'
    ports: !override
      - '127.0.0.1:3011:3000'
    logging:
      driver: journald
      options: { tag: aubesonore-preview-backend }

  frontend:
    build:
      args:
        VITE_API_URL: ''
    container_name: aubesonore-preview-frontend
    restart: 'no'
    ports: !override
      - '127.0.0.1:3012:80'
    logging:
      driver: journald
      options: { tag: aubesonore-preview-frontend }
    volumes:
      - ./preview/api.conf:/etc/nginx/snippets/preview-api.conf:ro

  renderer:
    build:
      args:
        VITE_API_URL: ''
    container_name: aubesonore-preview-renderer
    restart: 'no'
    logging:
      driver: journald
      options: { tag: aubesonore-preview-renderer }

  dev-init:
    image: aubesonore-preview-backend
