# Lancer depuis ce dossier : `docker compose up -d`. Le .env de ce dossier est un lien vers celui
# du dépôt ; Compose n'en passe au conteneur que les variables citées ci-dessous.
name: gatus

services:
  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    container_name: gatus
    restart: unless-stopped
    mem_limit: 128m
    network_mode: host
    environment:
      WHATSAPP_PHONE: ${WHATSAPP_PHONE}
      CALLMEBOT_APIKEY: ${CALLMEBOT_APIKEY}
      GATUS_TOKEN: ${GATUS_TOKEN}
      # Jeton des battements du site (site/.env), à part de celui du pipeline.
      GATUS_SITE_TOKEN: ${GATUS_SITE_TOKEN}
      NTFY_TOPIC: ${NTFY_TOPIC}
    volumes:
      # Le dossier, pas le fichier : un fichier monté seul garde son ancien inode quand git le
      # remplace, et Gatus ne voit plus ses mises à jour (README Gatus v5.37.0, « Reloading
      # configuration on the fly », issue #151). Il a tourné le 2026-10-02 sans l'endpoint grille.
      - ./config:/config:ro
      - gatus-data:/data

volumes:
  gatus-data:
