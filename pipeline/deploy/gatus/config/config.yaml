# Surveillance de l'antenne AubeSonore (docs/vision.md §8.2). Référence : README de Gatus v5.37.0.
storage:
  type: sqlite
  path: /data/gatus.db

web:
  address: 127.0.0.1
  port: 8050

alerting:
  custom:
    # Les gabarits sont insérés dans l'URL sans encodage : noms d'endpoints sans espace.
    url: "https://api.callmebot.com/whatsapp.php?phone=${WHATSAPP_PHONE}&apikey=${CALLMEBOT_APIKEY}&text=AubeSonore%20:%20[ENDPOINT_NAME]%20[ALERT_TRIGGERED_OR_RESOLVED]"
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "en%20panne"
        RESOLVED: "revenu%20a%20la%20normale"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
  # Second canal : CallMeBot répond 210 quand son quota est épuisé, et Gatus ne compte comme échec
  # d'envoi qu'un statut > 399 (alerting/provider/custom/custom.go:94 au tag v5.37.0) : l'alerte
  # WhatsApp peut se perdre en silence. Le sujet ntfy.sh est aléatoire, car il fait office de secret.
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: antenne
    group: radio
    url: "http://127.0.0.1:8080/api/nowplaying/aubesonore"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].is_online == true"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

  # La grille horaire joue, pas le secours (« AubeSonore ») : toutes les playlists horaires
  # s'appellent « Grille … » (pat(), README Gatus v5.37.0 § Conditions). Une heure de secours
  # (installation, heure en cours pendant la passe du dimanche) n'alerte pas : 7 sondes à 10 min.
  - name: grille-a-l-antenne
    group: radio
    url: "http://127.0.0.1:8080/api/nowplaying/aubesonore"
    interval: 10m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].now_playing.playlist == pat(Grille*)"
    alerts:
      - type: custom
        failure-threshold: 7
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 7
        minimum-reminder-interval: 24h

  # Le flux ne finit jamais : aucune condition ne lit le corps, Gatus ne le lit donc pas.
  - name: flux-public
    group: radio
    url: "https://radio.aubesonore.fr/listen/aubesonore/radio.mp3"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

  # Sans jeton Access, la page répond 403 : elle tourne. Le tunnel est couvert par flux-public.
  - name: page-de-vote
    group: radio
    url: "http://127.0.0.1:8040/"
    interval: 5m
    conditions:
      - "[STATUS] == 403"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

  # La page publique doit renvoyer vers la connexion Access : sinon la règle Access ou la route du
  # tunnel a sauté. Redirection non suivie (README Gatus v5.37.0, client.ignore-redirect).
  - name: page-de-vote-publique
    group: radio
    url: "https://votes.aubesonore.fr/"
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

  # Le site (site/) : la page d'accueil à travers Cloudflare, et l'API jusqu'au backend.
  - name: site
    group: site
    url: "https://aubesonore.fr/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

  - name: api
    group: site
    url: "https://api.aubesonore.fr/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
    alerts:
      - type: custom
        minimum-reminder-interval: 24h
      - type: ntfy
        minimum-reminder-interval: 24h

external-endpoints:
  - name: passe-hebdo
    group: radio
    token: "${GATUS_TOKEN}"
    heartbeat:
      interval: 192h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 1
        minimum-reminder-interval: 24h

  # Copie quotidienne de la base (radio-backup) : alerte au premier échec ou après 2 jours de silence.
  - name: sauvegarde
    group: radio
    token: "${GATUS_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 1
        minimum-reminder-interval: 24h

  # Sauvegarde restic des médias et de la config AzuraCast (azuracast-backup, 04:45,
  # azuracast/scripts/) : alerte au premier échec ou après 2 jours de silence.
  - name: sauvegarde-medias
    group: radio
    token: "${GATUS_AZURACAST_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 1
        minimum-reminder-interval: 24h

  # Grille du lendemain (radio-grille, 23:00) : alerte au premier échec ou après 2 jours de silence.
  - name: grille
    group: radio
    token: "${GATUS_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 1
        minimum-reminder-interval: 24h

  # Le déploiement du site tourne toutes les 2 min et peut construire 30 min : une heure sans
  # battement, c'est le timer qui s'est arrêté. 3 échecs de suite (6 min) : une coupure réseau
  # passagère n'alerte pas, un déploiement bloqué (migration, checkout pas sur master) si.
  - name: deploiement
    group: site
    token: "${GATUS_SITE_TOKEN}"
    heartbeat:
      interval: 1h
    alerts:
      - type: custom
        failure-threshold: 3
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 3
        minimum-reminder-interval: 24h

  - name: sauvegarde-site
    group: site
    token: "${GATUS_SITE_TOKEN}"
    heartbeat:
      interval: 48h
    alerts:
      - type: custom
        failure-threshold: 1
        minimum-reminder-interval: 24h
      - type: ntfy
        failure-threshold: 1
        minimum-reminder-interval: 24h
