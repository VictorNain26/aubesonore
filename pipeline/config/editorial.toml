# Réglages éditoriaux AubeSonore — validés au chargement (radio/core/config.py).

[library]
# Écart maximal de durée (secondes) entre le titre Plex et le titre Deezer rapproché.
duration_tolerance_s = 3

[discover]
# Artistes de la bibliothèque tirés comme graines à chaque passe de découverte.
seeds_per_run = 15
# Une graine n'est pas retirée avant ce délai (jours) après une passe réussie.
seed_cooldown_days = 30
# Titres lus par voisin (Deezer artist/{id}/top), et par artiste négatif.
tracks_per_neighbour = 10
# Similaires demandés à Last.fm pour chaque artiste.
lastfm_similar_limit = 100

[nouveautes]
# Titres récents choisis par des humains, ajoutés à la fournée de la semaine et jugés par le modèle.
# Hype Machine : pages du classement « lastweek » des blogs (API v2 non documentée, cf. vision §3).
# Le classement tient en 3 pages (50 titres) ; la page 4 répond 404 (mesuré le 2026-10-02).
hypem_pages = 3
# Titres les plus écoutés retenus par album des sélections éditoriales Deezer.
tracks_per_album = 3
# Compte Hype Machine dont les favoris publics ne sont plus des découvertes (vision §3.2).
hypem_favorites_user = "GhostRAvage"

[nouveautes.deezer_editorial]
# Genres Deezer (/editorial) dont la sélection d'albums est lue ; nom = libellé du rapport.
# Mesure du 2026-10-02 sur 22 genres (docs/recherches/2026-10-02-cycle-de-vie.md §9) : les genres
# où le modèle trouve la couleur de Victor, plus ceux qu'il aime (pop, rap, R&B, asiatique,
# soul) à l'essai ; le modèle trie titre par titre, les votes d'examen jugent chaque genre.
alternative = 85
electro = 106
dance = 113
jazz = 129
classique = 98
rock = 152
folk = 466
blues = 153
bresilienne = 75
pop = 132
rap = 116
rnb = 165
asiatique = 16
soul_funk = 169

[model]
# Régression logistique sur l'empreinte audio. C, poids des négatifs faibles : fixés le
# 2026-09-30 par validation croisée groupée par artiste sur les 159 votes du banc
# (docs/recherches/2026-09-30-modele-audio-seul.md).
c = 0.1
weak_weight = 0.1
# Titres retenus par fournée et par famille, les mieux notés d'abord : ~70 entrées par semaine et
# par famille tiennent la grille d'antenne (docs/recherches/2026-10-02-cycle-de-vie.md §3), plus
# ~12 % d'échecs d'acquisition.
keep_decouvertes = 80
keep_nouveautes = 80
# Plancher de note des nouveautés : au plus keep_nouveautes, jamais en dessous (décision du
# 2026-10-19 et votes qui la fondent : docs/vision.md §4, « Plancher des nouveautés »).
# 0 retient sans plancher.
min_score_nouveautes = 0.6
# Nombre de derniers votes d'examen qui jugent le modèle.
exam_window = 60

[acquisition]
# Titres retenus tentés au plus par passe (les deux familles de la dernière fournée), et
# tentatives par titre avant abandon.
max_per_pass = 160
max_attempts = 3
# Débit moyen minimal d'un MP3 (kbit/s) : un V0 tourne autour de 220-260.
min_mp3_kbps = 200
# Part de bits Chromaprint identiques entre le fichier et l'extrait Deezer
# (docs/recherches/2026-09-30-acquisition-publication-observabilite.md §2).
identity_threshold = 0.70
# Rythme des recherches Soulseek : le serveur bannit 30 min en cas de rafale.
searches_per_time = 10
searches_renew_s = 220
# Sous ce taux de fichiers prêts, la passe échoue et Gatus alerte ; le taux n'est jugé qu'à partir
# de min_attempts_for_rate tentatives.
min_success_rate = 0.2
min_attempts_for_rate = 20

[antenne]
# Cycle de vie d'un titre (docs/recherches/2026-10-02-cycle-de-vie.md §4) : premier séjour et
# séjour au fond de 6 semaines (KEXP), repos d'au moins 12 semaines (MusicMaster), péremption à
# 78 semaines (18 mois, BBC Radio 2), ~12 % d'une cohorte promue au fond.
stay_weeks = 6
rest_weeks = 12
life_weeks = 78
promotion_share = 0.12

[grille]
# Titres diffusés par heure, mesurés dans l'historique AzuraCast le 2026-10-02.
titres_par_heure = 14.6

# Enchaînement (docs/recherches/2026-10-02-cycle-de-vie.md §6). Chaque jour, les titres de chaque
# catégorie joués il y a le plus longtemps sont tirés avec cette marge, puis placés dans l'heure
# dont la cible leur ressemble.
marge = 1.4
retard = 0.5
# Règles incassables (docs/recherches/2026-10-02-programmation.md §3) : un titre se repose au moins
# `repos` tour de sa catégorie (60 %, MusicMaster) ; un artiste ne repasse pas avant
# `separation_h` heures (fenêtre DMCA, anti-doublon de la station). Règle anti-famine de
# GSelector : un titre en retard de `avantage` tours gagne jusqu'à `retard` contre la
# ressemblance, à `force` tours il passe d'office.
repos = 0.6
separation_h = 3
avantage = 1.5
force = 2.0
# Poids de la ressemblance de style (empreinte Discogs-EffNet) au titre d'avant, à côté de
# l'écart d'ambiance, au choix des titres comme à leur ordre
# (docs/recherches/2026-10-11-fil-de-style.md).
style = 1.0

# Part d'antenne de chaque catégorie et passages par semaine d'un même titre : le stock à
# l'antenne s'en déduit (part × titres par heure × 168 / passages).
[grille.categories.nouveautes]
part = 0.3333
passages = 2

[grille.categories.decouvertes]
part = 0.3333
passages = 2

[grille.categories.fond]
part = 0.1667
passages = 1

[grille.categories.reperes]
part = 0.1667
passages = 1


# Cibles des blocs de la journée, en quantiles des titres à l'antenne. Blocs et sens des écarts :
# Heggli, Stupacher, Vuust, Royal Society Open Science 2021 (PMC8580447) — matin dès 6 h plus
# énergique au tempo plus lent ; après-midi dès 12 h, tempo en hausse ; soir dès 20 h, tempo et
# dansabilité au plus haut ; nuit dès 23 h, au plus bas ; fin de nuit dès 4 h (5 h le week-end),
# un peu plus d'énergie que la nuit. La fête des vendredi et samedi soir, de 20 h à 3 h, est une
# décision de Victor (2026-09-23). L'amplitude des cibles est un choix, à ajuster à l'écoute.
[grille.cibles.matin]
energie = 0.6
dansabilite = 0.45
tempo = 0.4

[grille.cibles.apres_midi]
energie = 0.55
dansabilite = 0.5
tempo = 0.6

[grille.cibles.soir]
energie = 0.6
dansabilite = 0.65
tempo = 0.7

[grille.cibles.nuit]
energie = 0.25
dansabilite = 0.3
tempo = 0.25

[grille.cibles.fin_de_nuit]
energie = 0.35
dansabilite = 0.3
tempo = 0.3

[grille.cibles.fete]
energie = 0.75
dansabilite = 0.85
tempo = 0.75

[votes]
# Titres d'examen par sélection hebdomadaire, tirés au hasard à parts égales par famille (découvertes, nouveautés).
exam_per_selection = 10
# Titres de leçon par sélection : les plus proches de la coupure, un par artiste.
lesson_per_selection = 10
# Fenêtre des votes récents du rapport. Page de vote publiée et aucun titre en attente : une
# sélection plus ancienne déclenche une alerte (passe hebdomadaire en échec ?).
quiet_days = 7

[backup]
# Jours de copies quotidiennes de la base gardés dans RADIO_BACKUP_DIR.
keep_days = 14
