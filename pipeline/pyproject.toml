[project]
name = "aubesonore-radio"
version = "3.0.0"
description = "AubeSonore — goût, découverte, acquisition, antenne et votes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.27.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "requests>=2.34.2",
    "stamina>=26.1",
    "pyrate-limiter>=4.5.1,<5",
    "plexapi>=4.18.3",
    "numpy>=2.5.4",
    "essentia-tensorflow==2.1b6.dev1389",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "joblib>=1.6",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
radio = "radio.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "types-requests",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radio"]
artifacts = ["radio/core/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["radio/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["radio"]
strict = true
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["plexapi"]

[[tool.mypy.overrides]]
module = ["essentia", "essentia.*", "sklearn", "sklearn.*", "scipy", "scipy.*", "joblib"]
ignore_missing_imports = true
